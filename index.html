<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reminder App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.json" />
    <style></style>
</head>
<body
  class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 antialiased"
>
  <div class="container mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">
    <main class="md:flex md:space-x-8">
      <div class="md:w-2/5 lg:w-1/3">
        <div
          class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg mb-6 md:mb-0"
        >
          <header class="text-left mb-6">
            <h1 class="text-4xl font-bold text-blue-600">My reminders</h1>
            <h2 class="text-2xl font-semibold mb-4">Add a New Reminder</h2>
          </header>
          <hr class="mb-6 border-gray-200 dark:border-gray-700" />
          <div class="space-y-4">
            <div>
              <label
                for="reminderText"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Reminder</label
              >
              <input
                type="text"
                id="reminderText"
                placeholder="e.g. Check Email"
                class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
              />
            </div>
          </div>
          <div>
            <label
              for="reminderTime"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Time</label
            >
            <input
              type="datetime-local"
              id="reminderTime"
              class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
          </div>
          <button
            id="addReminderBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-600"
          >
            Set Reminder
          </button>
        </div>
        <button
          id="viewRemindersBtn"
          class="w-full mt-4 md:hidden bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition"
        >
          View All Reminders
        </button>
      </div>
      <div
        id="reminderSection"
        class="md:w-3/5 lg:w-2/3 mt-8 md:mt-0 hidden md:flex flex-col"
      >
        <h2 class="text-2xl font-semibold mb-4">Upcoming Reminders</h2>
        <div
          id="reminderList"
          class="space-y-4 overflow-y-auto max-h-64 md:max-h-[75vh] pr-2 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-lg"
        ></div>
      </div>
    </main>
  </div>
  <div
    id="alarm-modal"
    class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden"
  >
    <div
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center"
    >
      <h3 class="text-2xl font-bold mb-2 text-red-500">Reminder!</h3>
      <p
        id="alarm-text"
        class="text-lg text-gray-600 dark:text-gray-300 mb-6"
      >
        Your reminder is due.
      </p>
      <button
        id="stop-alarm-btn"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition"
      >
        Stop Alarm
      </button>
    </div>
    <div
      id="toast"
      class="fixed bottom-5 right-5 text-white py-2 px-4 rounded-lg opacity-0 transition-all duration-300"
    ></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
